# ============================================================
#  nginx.conf — InteractHub API reverse proxy
#
#  Key design:
#  - resolver 127.0.0.11 (Docker DNS) + set $variable → nginx
#    re-resolves hostnames every 10s instead of caching the
#    container IP at startup. Prevents 502 after container rebuild.
#  - proxy_pass $var (NO trailing path) → nginx forwards the
#    original URI as-is. Avoids double-prefix bug (/api//api/).
# ============================================================

# SignalR: upstream needed for ip_hash sticky sessions.
upstream api_signalr {
    ip_hash;
    server api:8080;
}

# ── Main entry point (port 80) ────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # 127.0.0.11 = Docker internal DNS; re-resolve every 10 s
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass $api_upstream;       # NO trailing path — forward URI as-is
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;POST ￼http://192.168.1.9:5153/api/Auth/login 404 (Not Found)
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── SignalR WebSocket (sticky — ip_hash) ──────────────────
    location /hubs/ {
        proxy_pass http://api_signalr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Swagger ───────────────────────────────────────────────
    location /swagger {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Healthcheck ───────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404 "Not found\n";
        add_header Content-Type text/plain;
    }
}

# ── Backward-compatible port 5153 ─────────────────────────────────────────────
server {
    listen 5153;
    server_name _;
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
