id: get_trending_topics
name: GetTrendingTopics
version: 1.1
description: |
  Query Redis sorted sets to return top trending topics for a category.
  Falls back to SQL Server (PostHashtag JOIN Hashtag, grouped by count) when Redis key is empty.
inputs:
  - name: category
    type: string
    required: false
    default: global
    description: |
      Category or time window. Accepted values:
        - "global" or empty → normalized to "daily"
        - "daily"   → Redis key trending:daily:YYYY-MM-DD
        - "weekly"  → Redis key trending:weekly:YYYY-WW
        - "monthly" → Redis key trending:monthly:YYYY-MM
  - name: limit
    type: integer
    required: false
    default: 10
    description: |
      Max number of topics to return. Must be between 1 and 100.
      If omitted or invalid (<= 0 | > 100) the skill defaults to 5.

      The LLM must extract this value from natural language phrases such as:
        - "top 5", "5 trending", "lấy 5", "cho tôi 5", "5 hashtag"   → limit = 5
        - "3 chủ đề", "liệt kê 3", "top 3"                           → limit = 3
        - "20 topics", "hiện 20"                                       → limit = 20
      When no explicit number is mentioned, use the default (10).
outputs:
  topics:
    type: array
    items:
      type: object
      properties:
        topic:  { type: string, description: "Hashtag or topic label" }
        score:  { type: number, description: "Trending score (Redis score) or post-usage count (SQL fallback)" }
        source: { type: string, enum: ["redis", "sql"], description: "Data origin" }
implementation_notes: |
  Priority:
    1. Read top `limit` members with ZREVRANGE + WITHSCORES from Redis sorted set.
    2. If the Redis key is missing or returns no members, fall back to SQL Server:
         SELECT h.NoiDung, COUNT(*) AS cnt
         FROM PostHashtag ph JOIN Hashtag h ON ph.IdHashtag = h.IdHashtag
         GROUP BY h.NoiDung
         ORDER BY cnt DESC
         TAKE limit
  Each result item contains a `source` field ("redis" or "sql").
  Permissions: read access to Redis; read access to SQL Server (PostHashtag + Hashtag tables).
examples:
  - request:
      category: tech
      limit: 5
    response:
      topics:
        - { topic: "#AI",     score: 982.3, source: "redis" }
        - { topic: "#DotNet", score: 712.1, source: "redis" }
  - request:
      category: global
      limit: 3
    note: Redis empty → SQL fallback
    response:
      topics:
        - { topic: "csharp",  score: 42, source: "sql" }
        - { topic: "dotnet",  score: 38, source: "sql" }
        - { topic: "backend", score: 31, source: "sql" }
