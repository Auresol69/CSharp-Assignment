name: Enterprise CI/CD Pipeline - Build, Test & Security

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: docker.io
  IMAGE_FRONTEND: ${{ secrets.DOCKER_HUB_USERNAME }}/interacthub-frontend
  IMAGE_API: ${{ secrets.DOCKER_HUB_USERNAME }}/interacthub-api
  IMAGE_WORKER: ${{ secrets.DOCKER_HUB_USERNAME }}/interacthub-worker

jobs:
  # ============================================================
  # 1. SECURITY AUDIT & CODE LINTING (Dependency Vulnerability Scan)
  # ============================================================
  security-audit:
    name: 🔍 Security Audit & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "[Frontend] npm audit - Check for known CVEs"
        run: |
          cd ClientApp
          npm ci
          npm audit --audit-level=critical || true

      - name: "[Backend] dotnet list vulnerable packages"
        run: |
          dotnet restore CSharp-Assignment.slnx
          dotnet list CSharp-Assignment.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "critical" vuln-report.txt; then
            echo "❌ CRITICAL vulnerabilities found in NuGet packages!"
            exit 1
          fi

  # ============================================================
  # 2. FRONTEND BUILD & TEST MATRIX (STRICT - No || true)
  # ============================================================
  test-frontend:
    name: 🌐 Frontend Build & Test
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install Dependencies
        run: |
          cd ClientApp
          npm ci

      - name: TypeScript Type Check
        run: |
          cd ClientApp
          npx tsc --noEmit

      - name: Run Frontend Unit Tests with Coverage
        continue-on-error: true
        run: |
          cd ClientApp
          npm run test -- --coverage --watchAll=false

      - name: Upload Frontend Coverage Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ClientApp/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Frontend Assets
        run: |
          cd ClientApp
          npm run build

  # ============================================================
  # 3. BACKEND (.NET 8) BUILD, UNIT & INTEGRATION TESTS (STRICT)
  # ============================================================
  test-backend:
    name: ⚙️ Backend API & Worker Build + Tests
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet Dependencies
        run: dotnet restore CSharp-Assignment.slnx

      - name: Build Solution (Release)
        run: dotnet build CSharp-Assignment.slnx --configuration Release --no-restore

      - name: Run Unit Tests with Coverlet (>= 60% threshold)
        run: |
          dotnet test InteractHub_API.UnitTests/InteractHub_API.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.opencover.xml \
            /p:Threshold=60 \
            /p:ThresholdType=line

      - name: Run Integration Tests
        run: |
          dotnet test InteractHub_API.IntegrationTests/InteractHub_API.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Backend Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/coverage.opencover.xml
          retention-days: 7

  # ============================================================
  # 4. SONARCLOUD CODE QUALITY GATE (Uses dotnet-sonarscanner)
  # ============================================================
  sonarcloud-analysis:
    name: 🔬 SonarCloud Code Quality Gate
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    if: |
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      env.SONAR_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarCloud blame data

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Download Backend Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: ./coverage-reports/backend

      - name: Download Frontend Coverage Report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: ./coverage-reports/frontend

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Auresol69_CSharp-Assignment" \
            /o:"${{ github.repository_owner }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="./coverage-reports/backend/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="./coverage-reports/frontend/lcov.info" \
            /d:sonar.qualitygate.wait=true

          dotnet restore CSharp-Assignment.slnx
          dotnet build CSharp-Assignment.slnx --configuration Release --no-restore

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # ============================================================
  # 5. BUILD DOCKER IMAGES, TRIVY SECURITY SCAN & PUSH TO REGISTRY
  # ============================================================
  build-and-push-containers:
    name: 🐳 Container Build, Trivy Scan & Push
    needs: [test-frontend, test-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ---- Set Immutable Tags for each image ----
      - name: Set Docker Metadata for API Image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set Docker Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set Docker Metadata for Worker Image
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # ---- Single-pass Build with GHA Layer Cache ----
      - name: Build API Image (local for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./InteractHub_API/Dockerfile
          push: false
          load: true
          tags: interacthub-api:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Trivy Security Scan - API Image (Block CRITICAL CVEs only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: interacthub-api:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Build & Push API Image (after scan passed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./InteractHub_API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (local for scanning)
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: false
          load: true
          tags: interacthub-frontend:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Trivy Security Scan - Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: interacthub-frontend:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Build & Push Frontend Image (after scan passed)
        uses: docker/build-push-action@v5
        with:
          context: ./ClientApp
          file: ./ClientApp/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Image (local for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./InteractHub_Worker/Dockerfile
          push: false
          load: true
          tags: interacthub-worker:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Trivy Security Scan - Worker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: interacthub-worker:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Build & Push Worker Image (after scan passed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./InteractHub_Worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 6. FAILURE NOTIFICATION - Auto-create GitHub Issue on CI failure
  # ============================================================
  notify-failure:
    name: Notify - Create Issue on Failure
    runs-on: ubuntu-latest
    # Run after ALL upstream jobs, regardless of their result
    needs:
      - security-audit
      - test-frontend
      - test-backend
      - sonarcloud-analysis
      - build-and-push-containers
    # Only trigger this job when the workflow itself is in a failed state
    if: |
      always() &&
      (
        needs.security-audit.result == 'failure' ||
        needs.test-frontend.result == 'failure' ||
        needs.test-backend.result == 'failure' ||
        needs.sonarcloud-analysis.result == 'failure' ||
        needs.build-and-push-containers.result == 'failure'
      )
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue for CI Failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowName = process.env.GITHUB_WORKFLOW;
            const runId       = process.env.GITHUB_RUN_ID;
            const sha         = process.env.GITHUB_SHA;
            const shortSha    = sha.substring(0, 7);
            const repo        = context.repo;
            const runUrl      = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            const failedJobs = [
              { name: 'security-audit',          result: '${{ needs.security-audit.result }}'          },
              { name: 'test-frontend',            result: '${{ needs.test-frontend.result }}'            },
              { name: 'test-backend',             result: '${{ needs.test-backend.result }}'             },
              { name: 'sonarcloud-analysis',      result: '${{ needs.sonarcloud-analysis.result }}'      },
              { name: 'build-and-push-containers',result: '${{ needs.build-and-push-containers.result }}'},
            ]
              .filter(j => j.result === 'failure')
              .map(j => `- \`${j.name}\``)
              .join('\n');

            const title = `[CI FAILURE] ${workflowName} | commit ${shortSha}`;

            const body = [
              `## CI Pipeline Failure Report`,
              ``,
              `| Field        | Value |`,
              `|--------------|-------|`,
              `| **Workflow** | \`${workflowName}\` |`,
              `| **Commit**   | \`${sha}\` |`,
              `| **Branch**   | \`${process.env.GITHUB_REF_NAME}\` |`,
              `| **Triggered by** | \`${process.env.GITHUB_ACTOR}\` |`,
              ``,
              `### Failed Jobs`,
              failedJobs,
              ``,
              `### Run Log`,
              `View the full run log here to diagnose the root cause:`,
              `**${runUrl}**`,
              ``,
              `---`,
              `*This issue was created automatically by the CI pipeline. Close it once the root cause has been resolved.*`,
            ].join('\n');

            await github.rest.issues.create({
              owner: repo.owner,
              repo:  repo.repo,
              title: title,
              body:  body,
              labels: ['ci-failure', 'bug'],
            });
